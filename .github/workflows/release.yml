name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Создание релиза
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Создание GitHub релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dma2ray ${{ github.ref_name }}
          body: |
            Dma2ray ${{ github.ref_name }} — VLESS клиент для Linux (GTK4/libadwaita, Xray-core).

            ## Установка

            Скомпилируйте бинарник локально:
            ```bash
            git clone https://github.com/linuxwaffIen/dma2ray.git
            cd dma2ray
            ./build.sh
            ./dist/dma2ray.dist/dma2ray
            ```

          download: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}