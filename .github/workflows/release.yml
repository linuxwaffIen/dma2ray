name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Создание релиза
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            python3-gi \
            python3-gi-cairo \
            libx11-dev \
            libglib2.0-dev \
            libjson-c-dev \
            dpkg-dev \
            binutils \
            coreutils \
            tar \
            gzip \
            xz-utils \
            zstd \
            bsdtar \
            makepkg \
            fakeroot \
            archlinux-keyring

      - name: Установка Nuitka и patchelf
        run: |
          pip install --upgrade pip
          pip install nuitka patchelf

      - name: Сборка бинарника (Nuitka)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Сборка deb / apk / arch пакетов
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh

      - name: Проверка версии бинарника
        run: |
          dist/dma2ray.dist/dma2ray --version

      - name: Создание GitHub релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dma2ray ${{ github.ref_name }}
          body: |
            Dma2ray ${{ github.ref_name }} — VLESS клиент для Linux (GTK4/libadwaita, Xray-core).

            ## Установка

            ### Arch Linux (x86_64)
            ```bash
            sudo pacman -U dma2ray-0.2.0-1-x86_64.pkg.tar.zst
            ```

            ### Debian/Ubuntu (amd64)
            ```bash
            sudo dpkg -i dma2ray_0.2.0-1_amd64.deb
            ```

            ### Alpine (x86_64)
            ```bash
            sudo apk add dma2ray-0.2.0-r1-x86_64.apk
            ```
          files: |
            dma2ray_0.2.0-1_amd64.deb
            dma2ray-0.2.0-1-x86_64.pkg.tar.zst
            dma2ray-0.2.0-r1-x86_64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}