name: CI/CD

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

jobs:
  test:
    name: Тесты и компиляция
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Установка системных зависимостей (GTK4, libadwaita, X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            python3-gi \
            python3-gi-cairo \
            libx11-dev \
            libglib2.0-dev \
            libjson-c-dev

      - name: Установка Python зависимостей
        run: |
          pip install --upgrade pip
          pip install nuitka patchelf

      - name: Проверка компиляции исходников
        run: |
          python3 -m compileall -q dma2ray tests

      - name: Запуск unit-тестов
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

  build:
    name: Сборка бинарника и пакетов
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            python3-gi \
            python3-gi-cairo \
            libx11-dev \
            libglib2.0-dev \
            libjson-c-dev \
            dpkg-dev \
            binutils \
            coreutils \
            tar \
            gzip \
            xz-utils \
            zstd \
            bsdtar \
            makepkg \
            fakeroot \
            archlinux-keyring

      - name: Установка Nuitka и patchelf
        run: |
          pip install --upgrade pip
          pip install nuitka patchelf

      - name: Сборка бинарника (Nuitka)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Сборка deb-пакета
        run: |
          set -e
          BIN="dist/dma2ray.dist/dma2ray"
          DEB_STAGE="deb_stage"
          rm -rf "$DEB_STAGE"
          mkdir -p "$DEB_STAGE/usr/usr/lib/dma2ray/app"
          mkdir -p "$DEB_STAGE/usr/usr/bin"
          mkdir -p "$DEB_STAGE/usr/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$DEB_STAGE/usr/usr/share/applications"
          cp -a "$BIN" "$DEB_STAGE/usr/usr/lib/dma2ray/app/dma2ray"
          chmod 755 "$DEB_STAGE/usr/usr/lib/dma2ray/app/dma2ray"
          ln -s ../lib/dma2ray/app/dma2ray "$DEB_STAGE/usr/usr/bin/dma2ray"
          cp -a data/io.github.dma2ray.Dma2ray.svg "$DEB_STAGE/usr/usr/share/icons/hicolor/scalable/apps/"
          cp -a data/io.github.dma2ray.Dma2ray.desktop "$DEB_STAGE/usr/usr/share/applications/"
          cp -a LICENSE README.md "$DEB_STAGE/usr/usr/lib/dma2ray/"
          cp -a dist/dma2ray.dist/helpers "$DEB_STAGE/usr/usr/lib/dma2ray/app/helpers"
          cp -a dist/dma2ray.dist/girepository "$DEB_STAGE/usr/usr/lib/dma2ray/app/girepository"
          cp -a dist/dma2ray.dist/*.so dist/dma2ray.dist/_*.so dist/dma2ray.dist/array.so dist/dma2ray.dist/zlib.so dist/dma2ray.dist/unicodedata.so dist/dma2ray.dist/select.so dist/dma2ray.dist/pyexpat.so dist/dma2ray.dist/mmap.so dist/dma2ray.dist/math.so dist/dma2ray.dist/grp.so dist/dma2ray.dist/binascii.so dist/dma2ray.dist/_zstd.so dist/dma2ray.dist/_uuid.so dist/dma2ray.dist/_struct.so dist/dma2ray.dist/_statistics.so dist/dma2ray.dist/_ssl.so dist/dma2ray.dist/_socket.so dist/dma2ray.dist/_sha3.so dist/dma2ray.dist/_sha2.so dist/dma2ray.dist/_sha1.so dist/dma2ray.dist/_random.so dist/dma2ray.dist/_queue.so dist/dma2ray.dist/_posixsubprocess.so dist/dma2ray.dist/_posixshmem.so dist/dma2ray.dist/_pickle.so dist/dma2ray.dist/_multiprocessing.so dist/dma2ray.dist/_multibytecodec.so dist/dma2ray.dist/_md5.so dist/dma2ray.dist/_lzma.so dist/dma2ray.dist/_interpreters.so dist/dma2ray.dist/_interpqueues.so dist/dma2ray.dist/_hmac.so dist/dma2ray.dist/_heapq.so dist/dma2ray.dist/_hashlib.so dist/dma2ray.dist/_decimal.so dist/dma2ray.dist/_ctypes.so dist/dma2ray.dist/_csv.so dist/dma2ray.dist/_codecs_tw.so dist/dma2ray.dist/_codecs_kr.so dist/dma2ray.dist/_codecs_jp.so dist/dma2ray.dist/_codecs_iso2022.so dist/dma2ray.dist/_codecs_hk.so dist/dma2ray.dist/_codecs_cn.so dist/dma2ray.dist/_bz2.so dist/dma2ray.dist/_blake2.so dist/dma2ray.dist/_asyncio.so dist/dma2ray.dist/libpython3.14.so.1.0 dist/dma2ray.dist/libexpat.so.1 dist/dma2ray.dist/libuuid.so.1 dist/dma2ray.dist/libssl.so.3 dist/dma2ray.dist/liblzma.so.5 dist/dma2ray.dist/libbrotlicommon.so.1 dist/dma2ray.dist/libzstd.so.1 dist/dma2ray.dist/libbrotlidec.so.1 dist/dma2ray.dist/libbrotlienc.so.1 dist/dma2ray.dist/libcrypto.so.3 dist/dma2ray.dist/libmpdec.so.4 dist/dma2ray.dist/libffi.so.8 dist/dma2ray.dist/libbz2.so.1.0 "$DEB_STAGE/usr/usr/lib/dma2ray/app/" 2>/dev/null || true
          mkdir -p "$DEB_STAGE/DEBIAN"
          cat > "$DEB_STAGE/DEBIAN/control" <<'EOF'
Package: dma2ray
Version: 0.2.0-1
Section: net
Priority: optional
Architecture: amd64
Maintainer: Dma2ray contributors <linuxwaffIen@users.noreply.github.com>
Description: Dma2ray - VLESS client for Linux (GTK4/libadwaita, Xray-core)
 Homepage: https://github.com/linuxwaffIen/dma2ray
EOF
          dpkg-deb --build "$DEB_STAGE" dma2ray_0.2.0-1_amd64.deb
          ls -lh dma2ray_0.2.0-1_amd64.deb

      - name: Сборка Arch пакета (.pkg.tar.zst)
        run: |
          set -e
          BIN="dist/dma2ray.dist/dma2ray"
          ARCH_STAGE="arch_stage"
          rm -rf "$ARCH_STAGE"
          mkdir -p "$ARCH_STAGE/usr/lib/dma2ray/app"
          mkdir -p "$ARCH_STAGE/usr/bin"
          mkdir -p "$ARCH_STAGE/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$ARCH_STAGE/usr/share/applications"
          cp -a "$BIN" "$ARCH_STAGE/usr/lib/dma2ray/app/dma2ray"
          chmod 755 "$ARCH_STAGE/usr/lib/dma2ray/app/dma2ray"
          ln -s ../lib/dma2ray/app/dma2ray "$ARCH_STAGE/usr/bin/dma2ray"
          cp -a data/io.github.dma2ray.Dma2ray.svg "$ARCH_STAGE/usr/share/icons/hicolor/scalable/apps/"
          cp -a data/io.github.dma2ray.Dma2ray.desktop "$ARCH_STAGE/usr/share/applications/"
          cp -a LICENSE README.md "$ARCH_STAGE/usr/lib/dma2ray/"
          cp -a dist/dma2ray.dist/helpers "$ARCH_STAGE/usr/lib/dma2ray/app/helpers"
          cp -a dist/dma2ray.dist/girepository "$ARCH_STAGE/usr/lib/dma2ray/app/girepository"
          cp -a dist/dma2ray.dist/*.so dist/dma2ray.dist/_*.so dist/dma2ray.dist/array.so dist/dma2ray.dist/zlib.so dist/dma2ray.dist/unicodedata.so dist/dma2ray.dist/select.so dist/dma2ray.dist/pyexpat.so dist/dma2ray.dist/mmap.so dist/dma2ray.dist/math.so dist/dma2ray.dist/grp.so dist/dma2ray.dist/binascii.so dist/dma2ray.dist/_zstd.so dist/dma2ray.dist/_uuid.so dist/dma2ray.dist/_struct.so dist/dma2ray.dist/_statistics.so dist/dma2ray.dist/_ssl.so dist/dma2ray.dist/_socket.so dist/dma2ray.dist/_sha3.so dist/dma2ray.dist/_sha2.so dist/dma2ray.dist/_sha1.so dist/dma2ray.dist/_random.so dist/dma2ray.dist/_queue.so dist/dma2ray.dist/_posixsubprocess.so dist/dma2ray.dist/_posixshmem.so dist/dma2ray.dist/_pickle.so dist/dma2ray.dist/_multiprocessing.so dist/dma2ray.dist/_multibytecodec.so dist/dma2ray.dist/_md5.so dist/dma2ray.dist/_lzma.so dist/dma2ray.dist/_interpreters.so dist/dma2ray.dist/_interpqueues.so dist/dma2ray.dist/_hmac.so dist/dma2ray.dist/_heapq.so dist/dma2ray.dist/_hashlib.so dist/dma2ray.dist/_decimal.so dist/dma2ray.dist/_ctypes.so dist/dma2ray.dist/_csv.so dist/dma2ray.dist/_codecs_tw.so dist/dma2ray.dist/_codecs_kr.so dist/dma2ray.dist/_codecs_jp.so dist/dma2ray.dist/_codecs_iso2022.so dist/dma2ray.dist/_codecs_hk.so dist/dma2ray.dist/_codecs_cn.so dist/dma2ray.dist/_bz2.so dist/dma2ray.dist/_blake2.so dist/dma2ray.dist/_asyncio.so dist/dma2ray.dist/libpython3.14.so.1.0 dist/dma2ray.dist/libexpat.so.1 dist/dma2ray.dist/libuuid.so.1 dist/dma2ray.dist/libssl.so.3 dist/dma2ray.dist/liblzma.so.5 dist/dma2ray.dist/libbrotlicommon.so.1 dist/dma2ray.dist/libzstd.so.1 dist/dma2ray.dist/libbrotlidec.so.1 dist/dma2ray.dist/libbrotlienc.so.1 dist/dma2ray.dist/libcrypto.so.3 dist/dma2ray.dist/libmpdec.so.4 dist/dma2ray.dist/libffi.so.8 dist/dma2ray.dist/libbz2.so.1.0 "$ARCH_STAGE/usr/lib/dma2ray/app/" 2>/dev/null || true
          cat > "$ARCH_STAGE/.PKGINFO" <<'EOF'
pkgname = dma2ray
pkgver = 0.2.0-1
pkgdesc = Dma2ray VLESS client (GTK4/libadwaita, Xray-core)
url = https://github.com/linuxwaffIen/dma2ray
arch = x86_64
license = GPL-3.0-only
size = 14484153
EOF
          bsdtar -cf - -C "$ARCH_STAGE" usr .PKGINFO | zstd -19 -o dma2ray-0.2.0-1-x86_64.pkg.tar.zst
          ls -lh dma2ray-0.2.0-1-x86_64.pkg.tar.zst

      - name: Сборка Alpine пакета (.apk)
        run: |
          set -e
          BIN="dist/dma2ray.dist/dma2ray"
          APK_STAGE="apk_stage"
          rm -rf "$APK_STAGE"
          mkdir -p "$APK_STAGE/usr/usr/lib/dma2ray/app"
          mkdir -p "$APK_STAGE/usr/usr/bin"
          mkdir -p "$APK_STAGE/usr/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$APK_STAGE/usr/usr/share/applications"
          cp -a "$BIN" "$APK_STAGE/usr/usr/lib/dma2ray/app/dma2ray"
          chmod 755 "$APK_STAGE/usr/usr/lib/dma2ray/app/dma2ray"
          ln -s ../lib/dma2ray/app/dma2ray "$APK_STAGE/usr/usr/bin/dma2ray"
          cp -a data/io.github.dma2ray.Dma2ray.svg "$APK_STAGE/usr/usr/share/icons/hicolor/scalable/apps/"
          cp -a data/io.github.dma2ray.Dma2ray.desktop "$APK_STAGE/usr/usr/share/applications/"
          cp -a LICENSE README.md "$APK_STAGE/usr/usr/lib/dma2ray/"
          cp -a dist/dma2ray.dist/helpers "$APK_STAGE/usr/usr/lib/dma2ray/app/helpers"
          cp -a dist/dma2ray.dist/girepository "$APK_STAGE/usr/usr/lib/dma2ray/app/girepository"
          cp -a dist/dma2ray.dist/*.so dist/dma2ray.dist/_*.so dist/dma2ray.dist/array.so dist/dma2ray.dist/zlib.so dist/dma2ray.dist/unicodedata.so dist/dma2ray.dist/select.so dist/dma2ray.dist/pyexpat.so dist/dma2ray.dist/mmap.so dist/dma2ray.dist/math.so dist/dma2ray.dist/grp.so dist/dma2ray.dist/binascii.so dist/dma2ray.dist/_zstd.so dist/dma2ray.dist/_uuid.so dist/dma2ray.dist/_struct.so dist/dma2ray.dist/_statistics.so dist/dma2ray.dist/_ssl.so dist/dma2ray.dist/_socket.so dist/dma2ray.dist/_sha3.so dist/dma2ray.dist/_sha2.so dist/dma2ray.dist/_sha1.so dist/dma2ray.dist/_random.so dist/dma2ray.dist/_queue.so dist/dma2ray.dist/_posixsubprocess.so dist/dma2ray.dist/_posixshmem.so dist/dma2ray.dist/_pickle.so dist/dma2ray.dist/_multiprocessing.so dist/dma2ray.dist/_multibytecodec.so dist/dma2ray.dist/_md5.so dist/dma2ray.dist/_lzma.so dist/dma2ray.dist/_interpreters.so dist/dma2ray.dist/_interpqueues.so dist/dma2ray.dist/_hmac.so dist/dma2ray.dist/_heapq.so dist/dma2ray.dist/_hashlib.so dist/dma2ray.dist/_decimal.so dist/dma2ray.dist/_ctypes.so dist/dma2ray.dist/_csv.so dist/dma2ray.dist/_codecs_tw.so dist/dma2ray.dist/_codecs_kr.so dist/dma2ray.dist/_codecs_jp.so dist/dma2ray.dist/_codecs_iso2022.so dist/dma2ray.dist/_codecs_hk.so dist/dma2ray.dist/_codecs_cn.so dist/dma2ray.dist/_bz2.so dist/dma2ray.dist/_blake2.so dist/dma2ray.dist/_asyncio.so dist/dma2ray.dist/libpython3.14.so.1.0 dist/dma2ray.dist/libexpat.so.1 dist/dma2ray.dist/libuuid.so.1 dist/dma2ray.dist/libssl.so.3 dist/dma2ray.dist/liblzma.so.5 dist/dma2ray.dist/libbrotlicommon.so.1 dist/dma2ray.dist/libzstd.so.1 dist/dma2ray.dist/libbrotlidec.so.1 dist/dma2ray.dist/libbrotlienc.so.1 dist/dma2ray.dist/libcrypto.so.3 dist/dma2ray.dist/libmpdec.so.4 dist/dma2ray.dist/libffi.so.8 dist/dma2ray.dist/libbz2.so.1.0 "$APK_STAGE/usr/usr/lib/dma2ray/app/" 2>/dev/null || true
          SIZE=$(stat -c%s "$APK_STAGE/usr/usr/lib/dma2ray/app/dma2ray")
          cat > "$APK_STAGE/.PKGINFO" <<EOF
pkgname = dma2ray
pkgver = 0.2.0-r1
pkgdesc = Dma2ray VLESS client (GTK4/libadwaita, Xray-core)
url = https://github.com/linuxwaffIen/dma2ray
arch = x86_64
license = GPL-3.0-only
size = $SIZE
EOF
          tar --format=ustar -czf "$APK_STAGE/pkg.tar" -C "$APK_STAGE" .PKGINFO usr
          gzip -9 -c "$APK_STAGE/pkg.tar" > dma2ray-0.2.0-r1.apk
          rm -f "$APK_STAGE/pkg.tar"
          ls -lh dma2ray-0.2.0-r1.apk

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: dma2ray-packages
          path: |
            dma2ray_0.2.0-1_amd64.deb
            dma2ray-0.2.0-1-x86_64.pkg.tar.zst
            dma2ray-0.2.0-r1.apk
          retention-days: 7

      - name: Проверка версии бинарника
        run: |
          dist/dma2ray.dist/dma2ray --version